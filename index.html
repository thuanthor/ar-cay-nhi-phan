<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-entity id="tree" position="0 0 -8"></a-entity>
    <a-sky color="#222"></a-sky>
  </a-scene>

  <script>
    const A = [4, 1, 7, 0, 2, 6, 8];
    const tree = document.querySelector('#tree');
    const nodes = [];     // nodes[k] là hình cầu của nút k
    const W = 8;          // độ rộng cả cây

    function viTri(k) {
      const level = Math.floor(Math.log2(k + 1));
      const idx = k - (2 ** level - 1);        // thứ tự trong mức
      const x = (idx + 0.5) * W / 2 ** level - W / 2;
      return { x: x, y: 3 - level };
    }

    // Vẽ cạnh nối cha - con
    for (let k = 1; k < A.length; k++) {
      const p = viTri(Math.floor((k - 1) / 2)), c = viTri(k);
      const e = document.createElement('a-entity');
      e.setAttribute('line', `start: ${p.x} ${p.y} 0; end: ${c.x} ${c.y} 0; color: white`);
      tree.appendChild(e);
    }
    // Vẽ nút
    for (let k = 0; k < A.length; k++) {
      const { x, y } = viTri(k);
      const s = document.createElement('a-sphere');
      s.setAttribute('position', `${x} ${y} 0`);
      s.setAttribute('radius', 0.4);
      s.setAttribute('color', '#4CC3D9');
      const t = document.createElement('a-text');
      t.setAttribute('value', A[k]);
      t.setAttribute('align', 'center');
      t.setAttribute('color', 'black');
      t.setAttribute('width', 12);
      t.setAttribute('position', '0 0 0.41');
      s.appendChild(t);
      tree.appendChild(s);
      nodes[k] = s;
    }
  </script>
</body>
</html>
